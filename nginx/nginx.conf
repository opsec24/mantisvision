events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstreams pointing to Docker internal service names
    upstream frontend_svc {
        server frontend:3000;
    }

    upstream backend_svc {
        server backend:8000;
    }

    # Main Platform Gateway: http://localhost, http://127.0.0.1
    server {
        listen 80 default_server;
        server_name localhost _;

        # Quick alias to jump straight into Swarm Traces & Observability
        location = /observability {
            return 302 /dashboard;
        }

        location /observability/ {
            return 302 /dashboard;
        }

        # FastAPI Backend APIs
        location /api/ {
            proxy_pass http://backend_svc/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events (SSE) support for real-time agent execution stream
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # OpenAPI / Swagger Documentation
        location /docs {
            proxy_pass http://backend_svc/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_svc/openapi.json;
            proxy_set_header Host $host;
        }

        # Frontend Next.js UI
        location / {
            proxy_pass http://frontend_svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
